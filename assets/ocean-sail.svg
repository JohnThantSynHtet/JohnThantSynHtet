<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Thant Syn Htet — Ocean Sail</title>
  <desc id="desc">An animated ocean banner with a realistic ivory-sailed white sailboat facing right, gently riding seamless midnight-blue waves. The name and role remain still.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02080e"/><stop offset=".55" stop-color="#05212c"/><stop offset="1" stop-color="#010810"/></linearGradient>
    <radialGradient id="halo" cx=".8" cy=".17" r=".72"><stop stop-color="#0a6a78" stop-opacity=".50"/><stop offset=".5" stop-color="#045268" stop-opacity=".12"/><stop offset="1" stop-color="#00121b" stop-opacity="0"/></radialGradient>
    <linearGradient id="current" x1="0" y1=".15" x2=".95" y2=".85"><stop stop-color="#12657b" stop-opacity="0"/><stop offset=".30" stop-color="#1699ab" stop-opacity=".24"/><stop offset=".70" stop-color="#3de6e5" stop-opacity=".45"/><stop offset="1" stop-color="#0e6a8a" stop-opacity="0"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ff8fa" stop-opacity=".25"/><stop offset="1" stop-color="#20ceda" stop-opacity="0"/></linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e687c"/><stop offset=".46" stop-color="#0c344b"/><stop offset="1" stop-color="#061d2d"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="shine"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="0"/></clipPath>
  
<linearGradient id="ivoryMain" x1=".03" y1=".3" x2=".96" y2=".9"><stop stop-color="#fff9e8"/><stop offset=".24" stop-color="#e3d9c3"/><stop offset=".50" stop-color="#bfbcae"/><stop offset=".72" stop-color="#f7f0dd"/><stop offset="1" stop-color="#819fad"/></linearGradient>
<linearGradient id="ivoryJib" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf1db"/><stop offset=".42" stop-color="#e8dfc9"/><stop offset=".80" stop-color="#c7cabd"/><stop offset="1" stop-color="#728d9e"/></linearGradient>
<linearGradient id="whiteHull" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".26" stop-color="#f2f5ee"/><stop offset=".62" stop-color="#c4d8db"/><stop offset=".9" stop-color="#557583"/><stop offset="1" stop-color="#183d51"/></linearGradient>
<radialGradient id="boatReflection" cx="50%" cy="0" r=".9"><stop stop-color="#e6e6c2" stop-opacity=".35"/><stop offset="1" stop-color="#24576c" stop-opacity="0"/></radialGradient>
</defs>
