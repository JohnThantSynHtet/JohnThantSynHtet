<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Thant Syn Htet — Ocean Sail</title>
  <desc id="desc">An HD vector banner with the original white sailboat and warm-ivory sails, gently riding midnight-blue waves beneath a starry sky. One brief shooting star appears once per 12-second loop. Name and role are stationary.</desc>
